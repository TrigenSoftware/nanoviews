packages:
  - packages/*
  - scripts/*
  - website
  - examples/*
  - examples/*/*
allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
autoInstallPeers: false
catalog:
  '@size-limit/preset-small-lib': ^14.0.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/user-event': ^14.5.2
  '@types/node': ^24.0.14
  '@vitest/coverage-v8': ^5.0.0
  happy-dom: ^21.0.0
  playwright: ^1.60.0
  react: ^19.2.8
  react-dom: ^19.2.8
  size-limit: ^14.0.0
  storybook: ^10.5.10
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^5.0.0
# Releases of nano_kit and the tooling of @trigen are taken right after they are published, younger than the day pnpm waits by default
minimumReleaseAgeExclude:
  - kida
  - agera
  - '@nano_kit/*'
  - '@trigen/*'
overrides:
  'nanoviews@*': workspace:^
  '@nanoviews/router@*': workspace:^
  '@nanoviews/storybook@*': workspace:^
  '@nanoviews/storybook-vite@*': workspace:^
workspaceConcurrency: 0
