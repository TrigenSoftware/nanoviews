packages:
  - packages/*
  - examples/*
  - examples/*/*
allowBuilds:
  esbuild: true
  simple-git-hooks: true
autoInstallPeers: false
catalog:
  '@size-limit/preset-small-lib': ^13.0.0
  '@testing-library/dom': ^10.4.1
  '@testing-library/jest-dom': ^7.0.0
  '@testing-library/user-event': ^14.5.2
  '@types/node': ^24.0.14
  '@vitest/coverage-v8': ^5.0.0
  happy-dom: ^20.0.0
  playwright: ^1.60.0
  react: ^19.2.8
  react-dom: ^19.2.8
  size-limit: ^13.0.0
  storybook: ^10.5.10
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^5.0.0
overrides:
  'nanoviews@*': workspace:^
  # Temporary until the kida 2.0 release line ships: keep the whole graph on
  # the same snapshot so examples get one kida instance shared with nanoviews.
  '@nano_kit/platform-web@*': 2.0.0-snapshot.20260830203546
  '@nano_kit/query@*': 2.0.0-snapshot.20260830203546
  '@nano_kit/store@*': 2.0.0-snapshot.20260830203546
